<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C84B31">
  <title>English Learning App</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EnglishApp">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Supabase JS client (auth + database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Capture OneSignal SDK console output for diagnostics (runs before the SDK) -->
  <script>
  window.__osLogs = [];
  (function () {
    ['log', 'info', 'warn', 'error', 'debug'].forEach(function (m) {
      try {
        var orig = console[m].bind(console);
        console[m] = function () {
          try {
            var msg = Array.prototype.map.call(arguments, function (a) {
              try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
            }).join(' ').slice(0, 220);
            if (/onesignal|duplicate init|skipping|incompatible|service worker|push/i.test(msg)) {
              window.__osLogs.push(msg);
              if (window.__osLogs.length > 30) window.__osLogs.shift();
            }
          } catch (e) {}
          return orig.apply(null, arguments);
        };
      } catch (e) {}
    });
  })();
  </script>
  <!-- OneSignal Web Push SDK (initialized only when a real App ID is configured) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <header id="app-header" class="hidden">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">📖</span>
        <span class="brand-name">English Learning</span>
      </div>
      <div class="header-right">
        <span id="header-user" class="header-user"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Log out</button>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- Persistent audio mini-player (stays visible across views) -->
  <div id="mini-player" class="mini-player hidden" aria-label="Audio player">
    <button id="mp-toggle" class="mp-btn" aria-label="Play or pause">▶</button>
    <div class="mp-info">
      <div id="mp-title" class="mp-title">—</div>
      <div class="mp-progress"><div id="mp-bar" class="mp-bar"></div></div>
    </div>
    <div id="mp-time" class="mp-time">0:00</div>
  </div>

  <!-- Bottom tab bar (mobile-first, one-handed) -->
  <nav id="tabbar" class="tabbar hidden" aria-label="Main navigation">
    <button class="tab" data-view="home"><span class="tab-icon">🏠</span><span class="tab-label">Home</span></button>
    <button class="tab" data-view="lesson"><span class="tab-icon">📖</span><span class="tab-label">Lesson</span></button>
    <button class="tab" data-view="scores"><span class="tab-icon">🏆</span><span class="tab-label">Scores</span></button>
    <button class="tab" data-view="mistakes"><span class="tab-icon">📝</span><span class="tab-label">Mistakes</span></button>
    <button class="tab hidden" data-view="admin" id="tab-admin"><span class="tab-icon">🛠</span><span class="tab-label">Admin</span></button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js?v=20260930n"></script>
</body>
</html>
