<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF9600">
  <meta name="description" content="Muse English — build real English, one daily lesson at a time. Words, listening, shadowing, grammar and a quiz for your level, A1 to C2.">
  <title>Muse English — Build real English, one daily lesson at a time</title>
  <style>
  /* Splash screen: visible instantly on launch, before app.js runs. */
  #splash{position:fixed;inset:0;z-index:1000;background:#FF9600;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #splash.hide{opacity:0;pointer-events:none;}
  #splash img{width:100%;height:100%;object-fit:cover;display:block;}
  </style>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Muse English">
  <link rel="stylesheet" href="css/styles.css?v=20261001c">
  <!-- Supabase JS client (auth + database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Capture OneSignal SDK console output for diagnostics (runs before the SDK) -->
  <script>
  window.__osLogs = [];
  (function () {
    ['log', 'info', 'warn', 'error', 'debug'].forEach(function (m) {
      try {
        var orig = console[m].bind(console);
        console[m] = function () {
          try {
            var msg = Array.prototype.map.call(arguments, function (a) {
              try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
            }).join(' ').slice(0, 220);
            if (/onesignal|duplicate init|skipping|incompatible|service worker|push/i.test(msg)) {
              window.__osLogs.push(msg);
              if (window.__osLogs.length > 30) window.__osLogs.shift();
            }
          } catch (e) {}
          return orig.apply(null, arguments);
        };
      } catch (e) {}
    });
  })();
  </script>
  <!-- OneSignal Web Push SDK (initialized only when a real App ID is configured) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<div id="splash"><img src="/media/splash.webp" alt="Muse English" fetchpriority="high"></div>
<script>
/* Splash fallback: if app.js fails to load, never trap the user behind the splash. */
setTimeout(function () {
  var s = document.getElementById('splash');
  if (s && !s.classList.contains('hide')) {
    s.classList.add('hide');
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
  }
}, 6000);
</script>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Public landing header (logged out) -->
  <header id="landing-header" class="landing-header hidden">
    <div class="landing-header-inner">
      <a class="brand" href="#/" aria-label="Muse English home">
        <img class="brand-icon" src="icons/icon-192.png" alt="" aria-hidden="true">
        <span class="brand-name">Muse English</span>
      </a>
      <nav class="landing-nav" aria-label="Product">
        <a href="#how-it-works">How it works</a>
        <a href="#levels">Levels</a>
      </nav>
      <div class="landing-actions">
        <a class="btn btn-ghost btn-sm" href="#/signin">Sign in</a>
        <a class="btn btn-sm" href="#/signup">Create account</a>
      </div>
    </div>
  </header>

  <!-- Logged-in app header: brand + compact profile menu -->
  <header id="app-header" class="hidden">
    <div class="header-inner">
      <a class="brand" href="#/home" aria-label="Muse English home">
        <span class="brand-mark" aria-hidden="true">📖</span>
        <span class="brand-name">Muse English</span>
      </a>
      <div class="header-right">
        <a id="btn-inbox" class="inbox-btn hidden" href="#/inbox" aria-label="Messages"><span aria-hidden="true">💬</span><span id="inbox-badge" class="inbox-badge hidden"></span></a>
        <a id="btn-profile" class="profile-btn" href="#/profile" aria-label="Profile">
          <span id="profile-initial" class="profile-initial">?</span>
        </a>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite" tabindex="-1"></main>

  <!-- Persistent audio mini-player (stays visible across views) -->
  <div id="mini-player" class="mini-player hidden" aria-label="Audio player">
    <img id="mp-cover" class="mp-cover" src="media/podcast/mascot-96.webp" alt="">
    <div class="mp-info">
      <div id="mp-title" class="mp-title">—</div>
      <div class="mp-row">
        <div id="mp-time" class="mp-time">0:00</div>
        <div class="mp-slider" id="mp-progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="mp-strack"></div>
          <div class="mp-sfill" id="mp-bar"></div>
        </div>
        <div id="mp-dur" class="mp-time">0:00</div>
      </div>
    </div>
    <button id="mp-toggle" class="mp-btn" aria-label="Play or pause"><img id="mp-toggle-img" src="media/podcast/btn-pause.webp" alt=""></button>
    <button id="mp-close" class="mp-x" aria-label="Close player"><img src="media/podcast/btn-x.webp" alt=""></button>
  </div>

  <!-- PWA install prompt (Android + iOS) -->
  <div id="pwa-prompt" class="pwa-prompt hidden" role="dialog" aria-label="Install Muse English">
    <img class="pwa-icon" src="icons/icon-192.png" alt="">
    <div class="pwa-text">
      <div class="pwa-title">Install Muse English</div>
      <div class="pwa-sub">Your daily lesson, one tap away.</div>
    </div>
    <button id="pwa-install" class="pwa-btn">Install</button>
    <button id="pwa-dismiss" class="pwa-x" aria-label="Not now">✕</button>
  </div>
  <div id="pwa-ios" class="pwa-sheet hidden" role="dialog" aria-label="How to install on iPhone">
    <div class="pwa-sheet-card">
      <img class="pwa-icon" src="icons/icon-192.png" alt="">
      <div class="pwa-title">Install Muse English</div>
      <ol class="pwa-steps">
        <li>Tap <b>Share</b> in Safari's toolbar</li>
        <li>Tap <b>Add to Home Screen</b></li>
        <li>Tap <b>Add</b> — done!</li>
      </ol>
      <button id="pwa-ios-done" class="pwa-btn pwa-btn-block">Got it</button>
    </div>
  </div>

  <!-- Learner navigation: bottom bar on mobile, sidebar on desktop -->
  <nav id="tabbar" class="tabbar hidden" aria-label="Main navigation">
    <button class="tab" data-view="home"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span class="tab-label">Home</span></button>
    <button class="tab" data-view="lesson"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg></span><span class="tab-label">Learn</span></button>
    <button class="tab" data-view="review"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></span><span class="tab-label">Review</span></button>
    <button class="tab" data-view="scores"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span class="tab-label">Progress</span></button>
    <button class="tab" data-view="challenge"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H5a2 2 0 0 0 0 4h2"/><path d="M17 6h2a2 2 0 0 1 0 4h-2"/></svg></span><span class="tab-label">Challenge</span></button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js?v=20261003e"></script>
</body>
</html>
