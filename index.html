<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212B">
  <title>English Learning App</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Supabase JS client (auth + database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- OneSignal Web Push SDK (initialized only when a real App ID is configured) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <header id="app-header" class="hidden">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">📖</span>
        <span class="brand-name">English Learning</span>
      </div>
      <div class="header-right">
        <span id="header-user" class="header-user"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Log out</button>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- Persistent audio mini-player (stays visible across views) -->
  <div id="mini-player" class="mini-player hidden" aria-label="Audio player">
    <button id="mp-toggle" class="mp-btn" aria-label="Play or pause">▶</button>
    <div class="mp-info">
      <div id="mp-title" class="mp-title">—</div>
      <div class="mp-progress"><div id="mp-bar" class="mp-bar"></div></div>
    </div>
    <div id="mp-time" class="mp-time">0:00</div>
  </div>

  <!-- Bottom tab bar (mobile-first, one-handed) -->
  <nav id="tabbar" class="tabbar hidden" aria-label="Main navigation">
    <button class="tab" data-view="home"><span class="tab-icon">🏠</span><span class="tab-label">Home</span></button>
    <button class="tab" data-view="lesson"><span class="tab-icon">📖</span><span class="tab-label">Lesson</span></button>
    <button class="tab" data-view="scores"><span class="tab-icon">🏆</span><span class="tab-label">Scores</span></button>
    <button class="tab" data-view="mistakes"><span class="tab-icon">📝</span><span class="tab-label">Mistakes</span></button>
    <button class="tab hidden" data-view="admin" id="tab-admin"><span class="tab-icon">🛠</span><span class="tab-label">Admin</span></button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
